name: Import ZorveX Intent Review Playbook ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "ZIP filename uploaded to the repository root"
        required: true
        default: "zorvex-discord-intent-review-playbook.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: import-intent-playbook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Validate and extract the ZIP
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail

          if [[ -z "$ZIP_NAME" || "$ZIP_NAME" == */* || "$ZIP_NAME" == *"\\"* || "$ZIP_NAME" != *.zip ]]; then
            echo "Provide only a .zip filename located in the repository root."
            exit 1
          fi

          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ZIP not found in repository root: $ZIP_NAME"
            exit 1
          fi

          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT

          python3 - "$ZIP_NAME" "$STAGE" <<'PY'
          import pathlib, re, stat, sys, zipfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])

          max_entries = 10000
          max_uncompressed_bytes = 200 * 1024 * 1024

          try:
              with zipfile.ZipFile(archive_path) as archive:
                  entries = archive.infolist()

                  if not entries:
                      raise ValueError("ZIP archive is empty")

                  if len(entries) > max_entries:
                      raise ValueError("Too many ZIP entries")

                  total_size = 0
                  seen = set()

                  for entry in entries:
                      name = entry.filename
                      path = pathlib.PurePosixPath(name)
                      mode = (entry.external_attr >> 16) & 0o170000

                      if (
                          not name
                          or path.is_absolute()
                          or ".." in path.parts
                          or "\\" in name
                          or re.match(r"^[A-Za-z]:", name)
                      ):
                          raise ValueError(f"Unsafe archive path: {name!r}")

                      if ".git" in path.parts or mode == stat.S_IFLNK:
                          raise ValueError(
                              f"Disallowed ZIP entry: {name!r}"
                          )

                      if name in seen:
                          raise ValueError(
                              f"Duplicate ZIP entry: {name!r}"
                          )

                      seen.add(name)
                      total_size += entry.file_size

                      if total_size > max_uncompressed_bytes:
                          raise ValueError(
                              "ZIP exceeds 200 MiB extraction limit"
                          )

                  archive.extractall(destination)

          except (
              zipfile.BadZipFile,
              OSError,
              RuntimeError,
              ValueError
          ) as exc:
              raise SystemExit(
                  f"ZIP validation/extraction failed: {exc}"
              ) from exc
          PY

          mapfile -t TOP_LEVEL < <(
            find "$STAGE" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | sort
          )

          SOURCE="$STAGE"

          if (( ${#TOP_LEVEL[@]} == 1 )) &&
             [[ -d "$STAGE/${TOP_LEVEL[0]}" ]]; then
            SOURCE="$STAGE/${TOP_LEVEL[0]}"
          fi

          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/.next/' \
            --exclude='/.venv/' \
            --exclude='/venv/' \
            --exclude='/__pycache__/' \
            --exclude='*.pyc' \
            --exclude='/.env' \
            "$SOURCE/" ./

          rm -- "$ZIP_NAME"

      - name: Commit and push the imported handbook
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "docs: import ZorveX intent review playbook"

          git push origin "HEAD:${GITHUB_REF_NAME}"
